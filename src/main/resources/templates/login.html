<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Little Caesars | Sistema de Gestion</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="login-page">
    <main class="login-card" aria-label="Inicio de sesion">
            <img th:src="@{/imagenes/logo.png}" alt="Little Caesars" class="login-logo">
            <h2>Iniciar sesion</h2>

            <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>
            <form id="loginForm" class="vstack gap-3">
                <div>
                    <label for="user" class="form-label">Usuario</label>
                    <input id="user" name="user" class="form-control form-control-lg" autocomplete="username" required>
                </div>
                <div>
                    <label for="contrasena" class="form-label">Contrasena</label>
                    <div class="password-field login-password-field">
                        <input id="contrasena" name="contrasena" type="password" class="form-control form-control-lg" autocomplete="current-password" required>
                        <button id="toggleLoginPassword" class="btn btn-outline-secondary password-toggle" type="button" aria-label="Mostrar contrasena"></button>
                    </div>
                </div>
                <button class="btn btn-brand btn-lg w-100" type="submit">Iniciar sesion</button>
            </form>
    </main>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
