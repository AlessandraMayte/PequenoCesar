<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Little Caesars | Pedidos Cocina</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="dashboard-page orders-view" data-page="cocina-pedidos" data-roles-allowed="COCINA">
    <aside th:replace="~{fragments/sidebar :: sidebar('cocina-pedidos')}"></aside>

    <main class="dashboard-main">
        <div id="appAlert" class="alert d-none" role="alert"></div>

        <section class="dashboard-section reports-page-grid">
            <div class="section-heading compact">
                <div><h1>Pedidos para cocina</h1></div>
                <button id="refreshButton" class="btn btn-brand" type="button">Actualizar</button>
            </div>

            <article class="panel-card report-table-card mt-4">
                <div class="panel-header">
                    <h2>Pedidos en preparacion</h2>
                    <span id="cocinaPedidosCount">0 pedidos</span>
                </div>
                <div class="table-search table-tools mb-3">
                    <input id="cocinaPedidosSearch" type="search" class="form-control" placeholder="Buscar cliente, estado o detalle..." autocomplete="off">
                    <select id="cocinaPedidosPageSize" class="form-select table-page-size" aria-label="Registros por pagina">
                        <option value="5">5</option>
                        <option value="10">10</option>
                        <option value="25">25</option>
                    </select>
                </div>
                <div class="table-responsive">
                    <table class="table app-table align-middle">
                        <thead><tr><th><button class="table-sort-button" type="button" data-sort-cocina-pedido="fechaHora">Fecha</button></th><th><button class="table-sort-button" type="button" data-sort-cocina-pedido="nombreCliente">Cliente</button></th><th><button class="table-sort-button" type="button" data-sort-cocina-pedido="estado">Estado</button></th><th>Detalle</th><th class="text-center">Accion</th></tr></thead>
                        <tbody id="cocinaPedidosTable"></tbody>
                    </table>
                </div>
                <div id="cocinaPedidosPagination" class="table-pagination"></div>
            </article>
        </section>
    </main>

    <div class="modal fade" id="cocinaPedidoDetalleModal" tabindex="-1" aria-labelledby="cocinaPedidoDetalleTitle" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="cocinaPedidoDetalleTitle" class="modal-title fs-5">Detalle de preparacion</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div id="cocinaPedidoDetalleBody" class="modal-body"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
