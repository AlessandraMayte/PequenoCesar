<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Little Caesars | Recetas</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="dashboard-page recipes-view" data-page="recetas" data-roles-allowed="GERENTE,COCINA">
    <aside th:replace="~{fragments/sidebar :: sidebar('recetas')}"></aside>

    <main class="dashboard-main employees-main">
        <div id="appAlert" class="alert d-none" role="alert"></div>

        <section class="dashboard-section recipes-layout">
            <div class="section-heading compact">
                <div><h1>Gestion de Recetas</h1></div>
                <button id="recetaSubmitTop" class="btn btn-brand" type="submit" form="recetaForm"><span class="btn-icon">+</span> Registrar receta</button>
            </div>

            <div class="employees-grid recipes-grid-panel">
                <article class="panel-card employee-form-card recipe-detail-card">
                    <div class="panel-header"><h2 id="recetaFormTitle">Nueva receta</h2><span>Definir ingredientes y cantidades</span></div>
                    <form id="recetaForm" class="vstack gap-3">
                        <input type="hidden" name="idReceta">
                        <input name="nombre" class="form-control" placeholder="Nombre de la receta" maxlength="120" required>
                        <div class="recipe-price-grid">
                            <input name="precioPersonal" type="number" min="0.01" step="0.01" class="form-control" placeholder="Precio personal" required>
                            <input name="precioMediana" type="number" min="0.01" step="0.01" class="form-control" placeholder="Precio mediana" required>
                            <input name="precioFamiliar" type="number" min="0.01" step="0.01" class="form-control" placeholder="Precio familiar" required>
                        </div>
                        <div class="recipe-form-preview">
                            <select id="recetaIngredienteSelect" class="form-select">
                                <option value="">Seleccionar insumo</option>
                            </select>
                            <div class="recipe-size-amounts">
                                <label class="recipe-size-field" for="recetaCantidadPersonal">
                                    <span>Personal</span>
                                    <input id="recetaCantidadPersonal" type="number" min="0.01" step="0.01" class="form-control" placeholder="Cantidad">
                                </label>
                                <label class="recipe-size-field" for="recetaCantidadMediana">
                                    <span>Mediana</span>
                                    <input id="recetaCantidadMediana" type="number" min="0.01" step="0.01" class="form-control" placeholder="Cantidad">
                                </label>
                                <label class="recipe-size-field" for="recetaCantidadFamiliar">
                                    <span>Familiar</span>
                                    <input id="recetaCantidadFamiliar" type="number" min="0.01" step="0.01" class="form-control" placeholder="Cantidad">
                                </label>
                            </div>
                            <button id="addRecetaIngrediente" class="btn btn-dark" type="button"><span class="btn-icon">+</span> Agregar ingrediente</button>
                        </div>
                        <div class="table-responsive">
                            <table class="table app-table align-middle">
                                <thead><tr><th>Ingrediente</th><th>Personal</th><th>Mediana</th><th>Familiar</th><th>Unidad</th><th class="text-center">Acciones</th></tr></thead>
                                <tbody id="recetaIngredientesTable"></tbody>
                            </table>
                        </div>
                        <div class="d-grid gap-2">
                            <button id="recetaSubmitButton" class="btn btn-dark w-100" type="submit"><span class="btn-icon">✓</span> Guardar receta</button>
                            <button id="cancelRecetaEdit" class="btn btn-outline-dark w-100 d-none" type="button"><span class="btn-icon">×</span> Cancelar edicion</button>
                        </div>
                    </form>
                </article>

                <article class="panel-card employees-table-card recipes-list-card">
                    <div class="panel-header"><h2>Recetas registradas</h2><span id="recetaResultCount">0 registros</span></div>
                    <div class="table-search table-tools mb-3">
                        <input id="recetaSearch" type="search" class="form-control" placeholder="Buscar receta o ingrediente..." autocomplete="off">
                        <select id="recetaPageSize" class="form-select table-page-size" aria-label="Registros por pagina">
                            <option value="5">5</option>
                            <option value="10">10</option>
                            <option value="25">25</option>
                        </select>
                    </div>
                    <div class="recipe-card-sort mb-3">
                        <button class="table-sort-button" type="button" data-sort-receta="nombre">Nombre</button>
                        <button class="table-sort-button" type="button" data-sort-receta="precio">Precio personal</button>
                        <button class="table-sort-button" type="button" data-sort-receta="cantidadIngredientes">Cantidad</button>
                        <button class="table-sort-button" type="button" data-sort-receta="estado">Estado</button>
                    </div>
                    <div id="recetasGrid" class="recipe-grid recipe-list-grid"></div>
                    <div id="recetaPagination" class="table-pagination"></div>
                </article>
            </div>
        </section>
    </main>

    <div class="modal fade" id="recetaIngredientesModal" tabindex="-1" aria-labelledby="recetaIngredientesModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="recetaIngredientesModalTitle" class="modal-title fs-5">Ingredientes de receta</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div id="recetaIngredientesModalBody" class="modal-body"></div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
