services:
  postgres:
    image: postgres:16-alpine
    container_name: cesar_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: cesar_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    container_name: pequeno_cesar
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/cesar_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      DEFAULT_ADMIN_ENABLED: ${DEFAULT_ADMIN_ENABLED:-false}
      DEFAULT_ADMIN_USER: ${DEFAULT_ADMIN_USER:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      DECOLECTA_BASE_URL: https://api.decolecta.com
      DECOLECTA_API_TOKEN: ${DECOLECTA_API_TOKEN:?DECOLECTA_API_TOKEN is required}
    ports:
      - "${APP_HOST_PORT:-8081}:8080"
    restart: unless-stopped

  postgres-backup:
    image: postgres:16-alpine
    container_name: cesar_db_backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
    command: >
      sh -c 'while true; do
        pg_dump -h postgres -U postgres -d cesar_db -Fc -f /backups/cesar_db_`date +%Y%m%d_%H%M%S`.dump &&
        find /backups -type f -name "cesar_db_*.dump" -mtime +7 -delete;
        sleep ${BACKUP_INTERVAL_SECONDS:-86400};
      done'
    restart: unless-stopped

volumes:
  postgres_data:
